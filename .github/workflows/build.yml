name: 앱 빌드 (APK)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK 만들기
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk sfcalllog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sfcalllog-apk
          path: sfcalllog.apk

      - name: 다운로드 페이지(Release)에 최신 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sfcalllog.apk \
            --title "세포 콜로그 최신 버전" \
            --notes "빌드: ${GITHUB_SHA::7} · 폰에서 sfcalllog.apk 를 눌러 설치하세요." \
            --latest
